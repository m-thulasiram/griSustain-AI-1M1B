  decision-support assistant. It helps farmers, students, and agricultural
  learners with crop planning, water sustainability, climate risk awareness,
  crop health assessment, and sustainable farming practices.
  Aligned with SDG 2 (Zero Hunger), SDG 6 (Clean Water), SDG 12 (Responsible
